<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>R4Everyone.Web</title>
    <base href="/"/>
    <script>
        (function () {
            try {
                const preference = localStorage.getItem("r4e-theme");
                if (preference && preference !== "system") {
                    document.documentElement.setAttribute("data-theme", preference);
                }
            } catch (error) {
                console.warn("R4Everyone: could not read the theme preference.", error);
            }
        })();
    </script>
    <link rel="preload" id="webassembly"/>
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="css/app.css"/>
    <link rel="icon" type="image/png" href="favicon.png"/>
    <link href="manifest.webmanifest" rel="manifest"/>
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png"/>
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png"/>
    <script type="importmap"></script>
</head>

<body>
<div id="app">
    <div class="app-loading">
        <div class="loading-title">R4Everyone is loading...</div>
        <div class="loading-bar" role="progressbar" aria-label="R4Everyone loading">
            <div class="loading-bar-fill"></div>
        </div>
    </div>
</div>

<div id="blazor-error-ui" role="alert">
    Something went wrong and R4Everyone needs to be reloaded. Unsaved changes may be lost.
    <a href="." class="reload">Reload</a>
    <button type="button" class="dismiss" aria-label="Dismiss">&times;</button>
</div>

<script src="js/viewport.js"></script>
<script src="js/files.js"></script>
<script src="js/lazy-images.js"></script>
<script src="js/images.js"></script>
<script src="js/cheat-editor.js"></script>
<script src="js/changelog.js"></script>
<script src="js/theme.js"></script>
<script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
<script>
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("service-worker.js", {updateViaCache: "none"})
            .catch((error) => console.error("R4Everyone: service worker registration failed.", error));
    }
</script>
</body>

</html>
